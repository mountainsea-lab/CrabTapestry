name: Build & Push Docker Images

on:
  push:
    branches:
      - main
      - dev
      - 'feature/crab-insight'
    tags:
      - 'v*'     # 仍支持发布版本标签构建

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
#          - crab_hmds-data-event
          - crab_hmds-hmds
          # - future-service  # 未来可扩展

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU and Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug workspace files
        run: |
          echo "=== 当前路径 ==="
          pwd
          echo "=== 根目录文件 ==="
          ls -lah
          echo "=== ${{ matrix.service }} 目录 ==="
          ls -lah ${{ matrix.service }} || true
          echo "=== libs 目录 ==="
          ls -lah libs || true

      - name: Determine Dockerfile to use
        id: df
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "file=${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          fi

      # 动态确定镜像标签
      - name: Set image tags
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # 推 tag 发布时
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "VERSION_TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "CHANNEL=release" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            # main 分支（稳定版）
            echo "TAG_NAME=main" >> $GITHUB_OUTPUT
            echo "VERSION_TAG=main-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
            echo "CHANNEL=stable" >> $GITHUB_OUTPUT
          else
            # 其他分支（例如 dev）
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "VERSION_TAG=${GITHUB_REF_NAME}-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
            echo "CHANNEL=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.df.outputs.file }}
          push: true
          tags: |
            mountainsealab/${{ matrix.service }}:${{ steps.vars.outputs.TAG_NAME }}
            mountainsealab/${{ matrix.service }}:${{ steps.vars.outputs.VERSION_TAG }}
            mountainsealab/${{ matrix.service }}:latest
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
