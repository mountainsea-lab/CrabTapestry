name: Build & Push Docker Images

on:
  push:
    branches:
      - main
      - dev
      - feature/**
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          #         - crab-data-event
          - crab-hmds
          # - future-service  # 可扩展更多服务

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU and Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔹 设置 SSH Key，用于拉取私有仓库
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Debug workspace files
        run: |
          echo "=== 当前路径 ==="
          pwd
          echo "=== 根目录文件 ==="
          ls -lah
          echo "=== ${{ matrix.service }} 目录 ==="
          ls -lah ${{ matrix.service }} || true
          echo "=== libs 目录 ==="
          ls -lah libs || true

      - name: Determine Dockerfile to use
        id: df
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "file=${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          fi

      # 🔹 规范化分支或标签名，用于镜像 tag
      - name: Sanitize ref name for Docker tag
        id: sanitize
        run: |
          REF_NAME=${{ github.ref_name }}
          SAFE_TAG=$(echo "$REF_NAME" | tr '/' '-')
          echo "safe_tag=$SAFE_TAG" >> $GITHUB_OUTPUT
          echo "✅ 使用镜像标签: $SAFE_TAG"

      # 🔹 构建并推送镜像（支持 SSH key）
      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.df.outputs.file }}
          push: true
          tags: |
            mountainsealab/${{ matrix.service }}:latest
            mountainsealab/${{ matrix.service }}:${{ steps.sanitize.outputs.safe_tag }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          ssh: default   # ✅ BuildKit 挂载 SSH
