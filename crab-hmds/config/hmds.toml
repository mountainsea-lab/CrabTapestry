# config/hmds.toml
[app]
# 设置回溯数据天数
lookback_days = 365

[[subscriptions]]
exchange = "BinanceFuturesUsd"
default_periods = ["1m", "5m", "15m", "1h", "4h", "1D", "1W"]
symbols = [
    { name = "btc", quote="usdt", periods = ["1m", "5m", "15m", "1h", "4h", "1D", "1W"] },
    { name = "eth", quote="usdt", periods = ["1m", "5m", "15m", "1h", "4h", "1D", "1W"] },
    { name = "sol", quote="usdt", periods = ["1m", "5m", "15m", "1h", "4h", "1D", "1W"] },
]

